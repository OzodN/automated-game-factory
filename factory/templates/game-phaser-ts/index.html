<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>__GAME_TITLE__</title>
    <style>
      * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #121624; touch-action: none; overscroll-behavior: none; }
      #game-container { position: fixed; inset: 0; overflow: hidden; }
      #game-container canvas { display: block; outline: none; }
      #boot-loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #121624; color: #e8ecf8; font: 600 18px system-ui, sans-serif; z-index: 10; transition: opacity 0.2s ease; }
      #boot-loader .track { width: min(260px, 70vw); height: 10px; margin-top: 14px; border-radius: 999px; background: rgba(255, 255, 255, 0.15); overflow: hidden; }
      #boot-progress { width: 3%; height: 100%; background: #5b8cff; transition: width 0.15s ease; }
    </style>
  </head>
  <body oncontextmenu="return false;">
    <div id="game-container"></div>
    <div id="boot-loader" aria-hidden="true"><div class="track"><div id="boot-progress"></div></div></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
